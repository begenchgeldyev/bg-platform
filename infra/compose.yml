name: begenchgeldyev

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    logging: *bounded-logging
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/version"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      site:
        condition: service_healthy
    networks:
      - begenchgeldyev-network

  site:
    logging: *bounded-logging
    build:
      context: ..
      dockerfile: infra/Dockerfile.production
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUN_IMAGE: ${BUN_IMAGE:-oven/bun:1}
    image: begenchgeldyev-site:${GIT_SHA:-local}
    restart: unless-stopped
    env_file:
      - ./site.env
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:8613/api/version'); if (!r.ok) process.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - begenchgeldyev-network

  postgres:
    logging: *bounded-logging
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: begench
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: begenchgeldyev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U begench -d begenchgeldyev"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - begenchgeldyev-network

volumes:
  pgdata:
  caddy-data:
  caddy-config:

networks:
  begenchgeldyev-network:
    driver: bridge
