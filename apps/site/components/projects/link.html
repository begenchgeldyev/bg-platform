<a
  href="{{ href }}"
  target="_blank"
  rel="noopener noreferrer"
  class="flex items-center justify-between gap-3 min-h-11 border border-outline-variant/40 bg-background/60 px-4 py-3 font-mono text-sm text-primary-container hover:border-primary-container hover:bg-primary-container/5 transition-colors motion-reduce:transition-none">
  <span>
    {{ label }}
    <span class="sr-only">— {{ newTabLabel }}</span>
  </span>
  <span aria-hidden="true">↗</span>
</a>
