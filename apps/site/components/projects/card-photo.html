<a
  href="{{ projectHref }}"
  class="{{ colSpanClass }} group relative overflow-hidden bg-surface-container-high border border-outline-variant/50 hover:border-primary-container/50 transition-all flex flex-col justify-between h-full">
  <div class="absolute inset-0 bg-black/60 group-hover:bg-black/40 transition-all z-10"></div>
  <img
    class="absolute inset-0 w-full h-full object-cover grayscale opacity-40 group-hover:scale-105 group-hover:opacity-60 transition-all duration-700"
    src="{{ image }}"
    alt="{{ name }} preview">
  <div class="relative z-20 p-7 md:p-8 flex flex-col justify-between h-full min-h-[360px]">
    <div class="flex items-start justify-between gap-4 mb-auto">
      <div></div>
      {{ hiddenBadge }}
    </div>
    <div class="space-y-4">
      {{ tagsHtml }}
      <div>
        <h2
          class="text-2xl md:text-3xl font-headline font-bold text-white uppercase group-hover:text-primary-container transition-colors tracking-tight">
          {{ name }}
        </h2>
        <p class="text-on-surface-variant max-w-xl mt-2 font-body font-medium text-sm leading-relaxed line-clamp-3">{{ description }}</p>
      </div>
      <div class="pt-2">
        <span class="inline-flex items-center text-primary-container font-mono text-xs uppercase font-bold gap-1.5">
          {{ viewProjectText }}
          <span class="material-symbols-outlined text-sm group-hover:translate-x-1 transition-transform" aria-hidden="true">
            arrow_forward
          </span>
        </span>
      </div>
    </div>
  </div>
</a>
