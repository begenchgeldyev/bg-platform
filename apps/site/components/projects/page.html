<!-- biome-ignore format: Inline path whitespace is visible; retain exact slash/name and cursor spacing. -->
<main class="max-w-6xl mx-auto px-5 sm:px-8 py-12 md:py-16 min-h-screen">
  <header class="projects-header project-path-header" {{headerEditableAttrs}}>
    <span aria-hidden="true">~/project/</span><h1 data-project-field="name" class="outline-none" spellcheck="false">{{ projectName }}</h1><span class="projects-header-cursor" aria-hidden="true"></span>
  </header>
  <div class="mb-10">
    <a
      href="/projects"
      class="inline-flex items-center gap-2 font-mono text-xs uppercase tracking-[0.2em] text-primary-container hover:text-primary">
      <span>←</span>
      <span>Back to projects</span>
    </a>
  </div>

  <section class="grid grid-cols-1 gap-8 {{ projectHasSidebar }}">
    <div class="min-w-0 space-y-8 {{ projectContentColumns }}">
      <div class="border border-outline-variant/30 bg-surface-container-lowest/60 p-8" {{headerEditableAttrs}}>
        <p
          data-project-field="description"
          class="max-w-3xl font-mono text-base leading-8 text-on-surface-variant outline-none"
          spellcheck="false">
          {{ description }}
        </p>
        {{ tagsHtml }}
        {{ editorHint }}
      </div>

      {{ imageBlock }}
      {{ imageMotion }}

      <div class="border border-outline-variant/30 bg-surface-container-lowest/40 p-8" {{contentEditableAttrs}}>
        <div class="mb-4 font-mono text-xs uppercase tracking-[0.2em] text-primary-container">[FULL_BRIEF]</div>
        <div
          data-project-field="content"
          class="font-mono text-sm leading-8 text-on-surface outline-none [&_a]:text-primary-container [&_code]:bg-background [&_code]:px-1 [&_pre]:overflow-x-auto [&_pre]:bg-background [&_pre]:p-4 [&_ul]:list-disc [&_ul]:pl-6"
          spellcheck="false">
          {{ content }}
        </div>
      </div>
      {{ editor }}
    </div>

    {{ projectSidebarHtml }}
  </section>
</main>
