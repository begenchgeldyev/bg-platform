<style>
  mark.cv-mark {
    background: transparent;
    color: inherit;
    white-space: nowrap;
    /* Horizontal breathing room without shifting the surrounding text. */
    padding: 0 0.3em;
    margin: 0 -0.3em;
    border-radius: 2px;
  }
  .cv-hit,
  .cv-hit-out {
    position: relative;
  }
  /* Terminal-selection block that covers the word while its state flips underneath. */
  .cv-hit::after,
  .cv-hit-out::after {
    content: '';
    position: absolute;
    inset: -1px;
    z-index: 1;
    pointer-events: none;
    background: #00ff41;
    box-shadow: 0 0 12px rgba(0, 255, 65, 0.8);
    transform: scaleX(0);
  }
  /* On: wipes in from the left, out to the right. */
  .cv-hit::after {
    animation: cv-wipe-in 560ms cubic-bezier(0.7, 0, 0.3, 1) var(--cv-delay, 0ms) both;
  }
  /* Off: the mirror image — in from the right, out to the left. */
  .cv-hit-out::after {
    animation: cv-wipe-out 560ms cubic-bezier(0.7, 0, 0.3, 1) var(--cv-delay, 0ms) both;
  }
  @keyframes cv-wipe-in {
    0% { transform: scaleX(0); transform-origin: left; }
    50% { transform: scaleX(1); transform-origin: left; }
    50.01% { transform: scaleX(1); transform-origin: right; }
    100% { transform: scaleX(0); transform-origin: right; }
  }
  @keyframes cv-wipe-out {
    0% { transform: scaleX(0); transform-origin: right; }
    50% { transform: scaleX(1); transform-origin: right; }
    50.01% { transform: scaleX(1); transform-origin: left; }
    100% { transform: scaleX(0); transform-origin: left; }
  }
  mark.cv-on {
    color: #00ff41;
    background-color: rgba(0, 255, 65, 0.14);
    text-shadow: 0 0 8px rgba(0, 255, 65, 0.65);
    animation: cv-glow 900ms ease-out;
  }
  button.cv-on {
    color: #00ff41;
    border-color: #00ff41;
    background-color: rgba(0, 255, 65, 0.12);
    text-shadow: 0 0 8px rgba(0, 255, 65, 0.65);
    box-shadow: 0 0 10px -2px rgba(0, 255, 65, 0.6);
    animation: cv-glow 900ms ease-out;
  }
  @keyframes cv-glow {
    0% { text-shadow: 0 0 16px #00ff41, 0 0 4px #00ff41; }
  }
  [data-cv-left] article {
    transition: opacity 250ms, border-color 250ms, box-shadow 250ms;
  }
  article.cv-article-match {
    border-left-color: #00ff41;
    box-shadow: -8px 0 14px -10px #00ff41;
  }
  article.cv-article-dim {
    opacity: 0.35;
  }
  @media (prefers-reduced-motion: reduce) {
    .cv-hit::after, .cv-hit-out::after { display: none; }
    mark.cv-on, button.cv-on { animation: none; }
  }
</style>
<script>
  (() => {
    const left = document.querySelector('[data-cv-left]');
    const skills = document.querySelector('[data-cv-skills]');
    if (!left || !skills) return;

    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const WIPE_MS = 560;
    const STAGGER_MS = 45;
    const MAX_DELAY_MS = 700;
    const GLYPHS = '!<>-_\\/[]{}—=+*^?#';

    const articles = [...left.querySelectorAll('article')];
    const chips = [...left.querySelectorAll('article .flex-wrap button'), ...skills.querySelectorAll('button')];
    // Captured up front: tag-scramble rewrites textContent while hovering.
    const labels = new Map(chips.map((chip) => [chip, chip.textContent]));
    for (const chip of chips) {
      chip.dataset.skill ||= chip.textContent.trim();
      chip.setAttribute('aria-pressed', 'false');
    }

    // term -> marks wrapped for it
    const selected = new Map();
    // term -> marks still playing their off animation
    const leaving = new Map();
    // chip -> number of selected terms that match it
    const chipHits = new Map();
    // element -> animation token; starting a new animation invalidates pending steps of the old one
    const tokens = new WeakMap();

    const termRegExp = (term) => {
      const escaped = term.replace(/[.*+?^${}()|[\]\\]/g, (c) => `\\${c}`);
      return new RegExp(`(?<![\\p{L}\\p{N}_])${escaped}(?![\\p{L}\\p{N}_])`, 'gu');
    };

    const textNodes = () => {
      const nodes = [];
      for (const article of articles) {
        const walker = document.createTreeWalker(article, NodeFilter.SHOW_TEXT, {
          acceptNode: (n) =>
            n.parentElement.closest('.flex-wrap, mark.cv-mark') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT,
        });
        while (walker.nextNode()) nodes.push(walker.currentNode);
      }
      return nodes;
    };

    const wrapMatches = (node, re, marks) => {
      const text = node.nodeValue;
      const fragment = document.createDocumentFragment();
      let last = 0;
      for (const m of text.matchAll(re)) {
        fragment.append(text.slice(last, m.index));
        const mark = document.createElement('mark');
        mark.className = 'cv-mark';
        mark.textContent = m[0];
        mark.dataset.text = m[0];
        fragment.append(mark);
        marks.push(mark);
        last = m.index + m[0].length;
      }
      if (last === 0) return;
      fragment.append(text.slice(last));
      node.replaceWith(fragment);
    };

    const unwrap = (mark) => {
      tokens.set(mark, (tokens.get(mark) ?? 0) + 1);
      const parent = mark.parentNode;
      mark.replaceWith(mark.dataset.text);
      parent?.normalize();
    };

    const decode = (el, text, token) => {
      const queue = [...text].map((ch) => {
        const start = Math.floor(Math.random() * 5);
        return { ch, start, end: start + 4 + Math.floor(Math.random() * 6) };
      });
      let frame = 0;
      const tick = () => {
        if (tokens.get(el) !== token || !el.isConnected) return;
        let done = 0;
        el.textContent = queue
          .map(({ ch, start, end }) => {
            if (ch === ' ' || frame >= end) {
              done++;
              return ch;
            }
            return frame >= start ? GLYPHS[Math.floor(Math.random() * GLYPHS.length)] : ch;
          })
          .join('');
        if (done < queue.length) {
          frame++;
          requestAnimationFrame(tick);
        }
      };
      tick();
    };

    // Plays the block wipe on `el`; at its midpoint (word fully covered) the lit state flips to `on`.
    const animate = (el, { on, delay, text, onDone }) => {
      const token = (tokens.get(el) ?? 0) + 1;
      tokens.set(el, token);
      el.textContent = text;
      el.classList.remove('cv-hit', 'cv-hit-out');
      if (reducedMotion) {
        el.classList.toggle('cv-on', on);
        onDone?.();
        return;
      }
      void el.offsetWidth; // restart the ::after animation
      el.style.setProperty('--cv-delay', `${delay}ms`);
      el.classList.add(on ? 'cv-hit' : 'cv-hit-out');
      setTimeout(() => {
        if (tokens.get(el) !== token) return;
        el.classList.toggle('cv-on', on);
        decode(el, text, token);
      }, delay + WIPE_MS / 2);
      setTimeout(() => {
        if (tokens.get(el) !== token) return;
        if (!on) el.classList.remove('cv-hit-out');
        onDone?.();
      }, delay + WIPE_MS);
    };

    const stagger = (i) => Math.min(i * STAGGER_MS, MAX_DELAY_MS);

    const updateArticles = () => {
      const matched = articles.filter((a) => a.querySelector('mark.cv-mark:not(.cv-leaving), button.cv-chip-match'));
      for (const a of articles) {
        a.classList.toggle('cv-article-match', matched.length > 0 && matched.includes(a));
        a.classList.toggle('cv-article-dim', matched.length > 0 && !matched.includes(a));
      }
    };

    const setPressed = (term, pressed) => {
      for (const chip of chips) if (chip.dataset.skill === term) chip.setAttribute('aria-pressed', String(pressed));
    };

    const matchingChips = (term) => {
      const re = termRegExp(term);
      return chips.filter((chip) => {
        re.lastIndex = 0;
        return re.test(chip.dataset.skill);
      });
    };

    const add = (term) => {
      // Re-selected before its off animation finished: drop the leftovers so the text can be re-wrapped.
      for (const mark of leaving.get(term) ?? []) unwrap(mark);
      leaving.delete(term);

      const marks = [];
      selected.set(term, marks);
      setPressed(term, true);

      const lit = [];
      for (const chip of matchingChips(term)) {
        const hits = (chipHits.get(chip) ?? 0) + 1;
        chipHits.set(chip, hits);
        chip.classList.add('cv-chip-match');
        if (hits === 1) lit.push(chip);
      }
      for (const node of textNodes()) wrapMatches(node, termRegExp(term), marks);

      // Left column lights up top-to-bottom; the skills panel at once.
      const cascade = [...left.querySelectorAll('mark.cv-mark, button.cv-chip-match')].filter(
        (el) => marks.includes(el) || lit.includes(el),
      );
      cascade.forEach((el, i) => {
        animate(el, { on: true, delay: stagger(i), text: el.dataset.text ?? labels.get(el) });
      });
      for (const chip of lit) {
        if (skills.contains(chip)) animate(chip, { on: true, delay: 0, text: labels.get(chip) });
      }
      updateArticles();
    };

    const remove = (term) => {
      const marks = selected.get(term);
      selected.delete(term);
      setPressed(term, false);

      const dark = [];
      for (const chip of matchingChips(term)) {
        const hits = chipHits.get(chip) - 1;
        if (hits > 0) {
          chipHits.set(chip, hits);
          continue;
        }
        chipHits.delete(chip);
        chip.classList.remove('cv-chip-match');
        dark.push(chip);
      }
      for (const mark of marks) mark.classList.add('cv-leaving');
      leaving.set(term, marks);

      // Mirror of `add`: bottom-to-top.
      const cascade = [...left.querySelectorAll('mark.cv-mark, button')]
        .filter((el) => marks.includes(el) || dark.includes(el))
        .reverse();
      cascade.forEach((el, i) => {
        const isMark = el.tagName === 'MARK';
        animate(el, {
          on: false,
          delay: stagger(i),
          text: isMark ? el.dataset.text : labels.get(el),
          onDone: isMark
            ? () => {
                unwrap(el);
                const rest = leaving.get(term);
                if (rest && rest.every((m) => !m.isConnected)) leaving.delete(term);
              }
            : undefined,
        });
      });
      for (const chip of dark) {
        if (skills.contains(chip)) animate(chip, { on: false, delay: 0, text: labels.get(chip) });
      }
      // Keep cards lit until the off wave has played, so it isn't hidden behind the dimming.
      setTimeout(updateArticles, reducedMotion ? 0 : stagger(cascade.length - 1) + WIPE_MS);
    };

    const toggle = (chip) => {
      const term = chip.dataset.skill;
      if (selected.has(term)) remove(term);
      else add(term);
    };

    for (const chip of chips) {
      chip.addEventListener('mousedown', (e) => {
        if (e.button === 0) toggle(chip);
      });
      chip.addEventListener('click', (e) => {
        if (e.detail === 0) toggle(chip);
      });
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') for (const term of [...selected.keys()]) remove(term);
    });
  })();
</script>
