<button
  type="button"
  data-terminal-fullscreen
  data-expand-label="{{ terminalExpandLabel }}"
  data-restore-label="{{ terminalRestoreLabel }}"
  aria-label="{{ terminalExpandLabel }}"
  title="{{ terminalExpandLabel }}"
  aria-pressed="false"
  class="w-11 h-11 inline-flex items-center justify-center text-on-surface-variant hover:text-primary-container cursor-pointer">
  <svg
    data-expand-icon
    aria-hidden="true"
    width="18"
    height="18"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.5"
    stroke-linecap="square">
    <path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5" />
  </svg>
  <svg
    data-restore-icon
    aria-hidden="true"
    width="18"
    height="18"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.5"
    stroke-linecap="square"
    hidden>
    <path d="M3 8h5V3m8 0v5h5M8 21v-5H3m13 5v-5h5" />
  </svg>
</button>
<span data-fullscreen-status role="status" class="sr-only"></span>
