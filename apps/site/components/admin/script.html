<script>
(() => {
  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#39;');
  }

  // CLAUDE.md keeps pointer presses on mousedown. Native buttons still fire a click for
  // Enter, Space, screen readers and synthetic activations; those report detail 0, while
  // the click produced by a pointer press reports a click count of 1 or more. Handling
  // only detail 0 skips the click that follows a mousedown, so nothing runs twice.
  function onAction(el, handler) {
    if (!el) return;
    el.addEventListener('mousedown', (e) => {
      if (e.button === 0) {
        e.preventDefault();
        handler(e);
      }
    });
    el.addEventListener('click', (e) => {
      if (e.detail === 0) {
        handler(e);
      }
    });
  }

  const projectsDataEl = document.getElementById('admin-projects-data');
  const iconsDataEl = document.getElementById('admin-icons-data');
  let projects = [];
  try {
    projects = projectsDataEl ? JSON.parse(projectsDataEl.textContent || '[]') : [];
  } catch (err) {
    console.error('Failed to parse admin projects JSON', err);
  }

  let projectIcons = [];
  try {
    projectIcons = iconsDataEl ? JSON.parse(iconsDataEl.textContent || '[]') : [];
  } catch (err) {
    console.error('Failed to parse admin icons JSON', err);
  }

  let currentProjectId = null;
  let currentIcon = null;
  let currentImage = '';
  let inFlight = false;

  const projectListEl = document.getElementById('admin-project-list');
  const projectCountEl = document.getElementById('admin-project-count');
  const newProjectBtn = document.getElementById('admin-new-project-btn');
  const logoutBtn = document.getElementById('admin-logout-btn');
  const editorModeBadge = document.getElementById('admin-editor-mode-badge');
  const viewLiveLink = document.getElementById('admin-view-live-link');
  const editorStatusEl = document.getElementById('admin-editor-status');

  const formName = document.getElementById('admin-form-name');
  const formHidden = document.getElementById('admin-form-hidden');
  const formDescription = document.getElementById('admin-form-description');
  const formTags = document.getElementById('admin-form-tags');
  const tagsPreview = document.getElementById('admin-tags-preview');
  const formContent = document.getElementById('admin-form-content');
  const iconGrid = document.getElementById('admin-icon-grid');
  const selectedIconText = document.getElementById('admin-selected-icon-text');

  const photoInput = document.getElementById('admin-photo-input');
  const photoPreviewImg = document.getElementById('admin-photo-preview-img');
  const photoPlaceholder = document.getElementById('admin-photo-placeholder');
  const photoUploadTrigger = document.getElementById('admin-photo-upload-trigger');
  const photoRemoveTrigger = document.getElementById('admin-photo-remove-trigger');

  const saveBtn = document.getElementById('admin-save-btn');
  const resetBtn = document.getElementById('admin-reset-btn');
  const deleteBtn = document.getElementById('admin-delete-btn');

  function setDisabled(disabled) {
    if (saveBtn) saveBtn.disabled = disabled;
    if (resetBtn) resetBtn.disabled = disabled;
    if (deleteBtn) deleteBtn.disabled = disabled;
    if (newProjectBtn) newProjectBtn.disabled = disabled;
    if (logoutBtn) logoutBtn.disabled = disabled;
    const projectButtons = projectListEl?.querySelectorAll('button') || [];
    projectButtons.forEach((btn) => {
      btn.disabled = disabled;
    });
  }

  function showStatus(message, isError) {
    if (!editorStatusEl) return;
    editorStatusEl.textContent = message;
    editorStatusEl.className = isError
      ? 'block border border-error/50 bg-error-container/20 text-error font-mono text-xs p-3.5 leading-relaxed'
      : 'block border border-primary-container/50 bg-primary-container/10 text-primary-container font-mono text-xs p-3.5 leading-relaxed';
  }

  function clearStatus() {
    if (!editorStatusEl) return;
    editorStatusEl.textContent = '';
    editorStatusEl.className = 'hidden font-mono text-xs p-3.5 leading-relaxed';
  }

  function updateTagsPreview() {
    if (!tagsPreview || !formTags) return;
    const raw = formTags.value;
    const tags = raw
      .split(',')
      .map((t) => t.trim())
      .filter(Boolean);
    if (tags.length === 0) {
      tagsPreview.innerHTML = '<span class="text-[10px] font-mono text-outline-variant/60 italic">No tags defined</span>';
      return;
    }
    tagsPreview.innerHTML = tags
      .map(
        (t) =>
          `<span class="text-[9px] font-mono font-bold border border-outline-variant/60 bg-surface/40 px-2 py-1 text-on-surface-variant uppercase">${escapeHtml(t)}</span>`,
      )
      .join('');
  }

  function updatePhotoPreview() {
    if (!photoPreviewImg || !photoPlaceholder || !photoRemoveTrigger) return;
    if (currentImage?.trim()) {
      photoPreviewImg.src = currentImage;
      photoPreviewImg.classList.remove('hidden');
      photoPlaceholder.classList.add('hidden');
      photoRemoveTrigger.classList.remove('hidden');
    } else {
      photoPreviewImg.src = '';
      photoPreviewImg.classList.add('hidden');
      photoPlaceholder.classList.remove('hidden');
      photoRemoveTrigger.classList.add('hidden');
    }
  }

  function updateIconSelector() {
    if (!iconGrid || !selectedIconText) return;
    selectedIconText.textContent = currentIcon || 'Automatic';

    const buttons = iconGrid.querySelectorAll('[data-icon-val]');
    buttons.forEach((btn) => {
      const val = btn.dataset.iconVal;
      const isSelected = (!currentIcon && val === '') || (currentIcon && val === currentIcon);
      if (isSelected) {
        btn.className =
          'flex flex-col items-center justify-center p-2 border border-primary-container bg-primary-container/20 text-primary-container ring-1 ring-primary-container cursor-pointer transition-all focus:outline-none focus:ring-1 focus:ring-primary-container';
      } else {
        btn.className =
          'flex flex-col items-center justify-center p-2 border border-outline-variant/30 bg-surface/40 text-on-surface-variant hover:border-outline-variant/80 hover:text-white cursor-pointer transition-all focus:outline-none focus:ring-1 focus:ring-primary-container';
      }
    });
  }

  function renderIconGrid() {
    if (!iconGrid) return;
    iconGrid.innerHTML = '';

    const autoBtn = document.createElement('button');
    autoBtn.type = 'button';
    autoBtn.dataset.iconVal = '';
    autoBtn.title = 'Automatic (inferred from name and description)';
    autoBtn.innerHTML = `
      <span class="material-symbols-outlined text-lg" aria-hidden="true">auto_awesome</span>
      <span class="text-[9px] font-mono uppercase tracking-tighter mt-1 truncate w-full text-center">Auto</span>
    `;
    onAction(autoBtn, () => {
      if (inFlight) return;
      currentIcon = null;
      updateIconSelector();
    });
    iconGrid.appendChild(autoBtn);

    projectIcons.forEach((iconName) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.dataset.iconVal = iconName;
      btn.title = iconName;
      btn.innerHTML = `
        <span class="material-symbols-outlined text-lg" aria-hidden="true">${escapeHtml(iconName)}</span>
        <span class="text-[9px] font-mono uppercase tracking-tighter mt-1 truncate w-full text-center">${escapeHtml(iconName)}</span>
      `;
      onAction(btn, () => {
        if (inFlight) return;
        currentIcon = iconName;
        updateIconSelector();
      });
      iconGrid.appendChild(btn);
    });

    updateIconSelector();
  }

  function renderProjectList() {
    if (!projectListEl || !projectCountEl) return;
    projectCountEl.textContent = String(projects.length);

    const activeEl = document.activeElement;
    const focusedId = activeEl && projectListEl.contains(activeEl) ? activeEl.dataset.projectId : null;

    projectListEl.innerHTML = '';

    if (projects.length === 0) {
      projectListEl.innerHTML = `
        <div class="p-6 text-center border border-dashed border-outline-variant/30 text-on-surface-variant font-mono text-xs">
          No projects found in database.
        </div>
      `;
      return;
    }

    projects.forEach((proj) => {
      const isSelected = proj.id === currentProjectId;
      const item = document.createElement('button');
      item.type = 'button';
      item.dataset.projectId = String(proj.id);
      item.className = isSelected
        ? 'w-full text-left p-3 border border-primary-container bg-surface-container-high transition-all cursor-pointer focus:outline-none focus:ring-1 focus:ring-primary-container disabled:opacity-50 disabled:cursor-not-allowed'
        : 'w-full text-left p-3 border border-outline-variant/30 bg-surface/50 hover:border-outline-variant/70 hover:bg-surface transition-all cursor-pointer focus:outline-none focus:ring-1 focus:ring-primary-container disabled:opacity-50 disabled:cursor-not-allowed';

      if (inFlight) {
        item.disabled = true;
      }

      const iconName = proj.icon || 'terminal';
      const statusBadge = proj.isHidden
        ? `<span class="text-[10px] font-mono font-bold uppercase px-1.5 py-0.5 border border-amber-500/40 bg-amber-500/10 text-amber-400">Hidden</span>`
        : `<span class="text-[10px] font-mono font-bold uppercase px-1.5 py-0.5 border border-primary-container/40 bg-primary-container/10 text-primary-container">Published</span>`;

      item.innerHTML = `
        <div class="flex items-center justify-between gap-3">
          <div class="flex items-center gap-2.5 min-w-0">
            <span class="material-symbols-outlined text-base text-primary-container flex-shrink-0" aria-hidden="true">${escapeHtml(iconName)}</span>
            <span class="font-mono text-xs font-bold text-white truncate uppercase">${escapeHtml(proj.name)}</span>
          </div>
          <div class="flex-shrink-0">
            ${statusBadge}
          </div>
        </div>
      `;

      onAction(item, () => {
        if (!inFlight) {
          selectProject(proj.id);
        }
      });

      projectListEl.appendChild(item);
    });

    if (focusedId) {
      const btnToFocus = projectListEl.querySelector(`button[data-project-id="${focusedId}"]`);
      if (btnToFocus) {
        btnToFocus.focus();
      }
    }
  }

  function selectProject(id) {
    const proj = projects.find((p) => p.id === id);
    if (!proj) {
      selectNewProject();
      return;
    }

    currentProjectId = proj.id;
    currentIcon = proj.icon || null;
    currentImage = proj.image || '';

    if (formName) formName.value = proj.name || '';
    if (formHidden) formHidden.checked = Boolean(proj.isHidden);
    if (formDescription) formDescription.value = proj.description || '';
    if (formTags) formTags.value = (proj.tags || []).join(', ');
    if (formContent) formContent.value = proj.content || '';

    if (editorModeBadge) {
      editorModeBadge.textContent = `[MODE: EDITING #${proj.id}]`;
    }
    if (viewLiveLink) {
      viewLiveLink.href = `/projects/${proj.id}`;
      viewLiveLink.classList.remove('hidden');
    }
    if (deleteBtn) {
      deleteBtn.classList.remove('hidden');
    }

    updateTagsPreview();
    updatePhotoPreview();
    updateIconSelector();
    renderProjectList();
    clearStatus();
  }

  function selectNewProject() {
    currentProjectId = null;
    currentIcon = null;
    currentImage = '';

    if (formName) formName.value = '';
    if (formHidden) formHidden.checked = false;
    if (formDescription) formDescription.value = '';
    if (formTags) formTags.value = '';
    if (formContent) formContent.value = '';

    if (editorModeBadge) {
      editorModeBadge.textContent = '[MODE: NEW PROJECT]';
    }
    if (viewLiveLink) {
      viewLiveLink.href = '#';
      viewLiveLink.classList.add('hidden');
    }
    if (deleteBtn) {
      deleteBtn.classList.add('hidden');
    }

    updateTagsPreview();
    updatePhotoPreview();
    updateIconSelector();
    renderProjectList();
    clearStatus();
    if (formName) formName.focus();
  }

  if (photoUploadTrigger && photoInput) {
    onAction(photoUploadTrigger, () => {
      if (inFlight) return;
      photoInput.click();
    });

    photoInput.addEventListener('change', (e) => {
      const file = e.target.files?.[0];
      if (!file) return;

      const maxBytes = 2 * 1024 * 1024;
      if (file.size > maxBytes) {
        showStatus(`File exceeds 2 MB limit (${(file.size / (1024 * 1024)).toFixed(2)} MB). Refused before reading.`, true);
        photoInput.value = '';
        return;
      }

      const reader = new FileReader();
      reader.onload = (loadEvent) => {
        currentImage = typeof loadEvent.target?.result === 'string' ? loadEvent.target.result : '';
        updatePhotoPreview();
        photoInput.value = '';
        clearStatus();
      };
      reader.onerror = () => {
        showStatus('Failed to read file as data URL', true);
        photoInput.value = '';
      };
      reader.readAsDataURL(file);
    });
  }

  if (photoRemoveTrigger) {
    onAction(photoRemoveTrigger, () => {
      if (inFlight) return;
      currentImage = '';
      updatePhotoPreview();
      if (photoInput) photoInput.value = '';
    });
  }

  if (formTags) {
    formTags.addEventListener('input', updateTagsPreview);
  }

  async function handleSave() {
    if (inFlight) return;
    const targetId = currentProjectId;
    const nameVal = formName ? formName.value.trim() : '';
    if (!nameVal) {
      showStatus('Project name is required', true);
      if (formName) formName.focus();
      return;
    }

    const rawTags = formTags ? formTags.value : '';
    const tags = rawTags
      .split(',')
      .map((t) => t.trim())
      .filter(Boolean);

    const payload = {
      name: nameVal,
      description: formDescription?.value?.trim() || null,
      content: formContent?.value?.trim() || null,
      tags: tags,
      icon: currentIcon,
      image: currentImage || null,
      isHidden: Boolean(formHidden?.checked),
    };

    inFlight = true;
    setDisabled(true);
    showStatus('Saving project to database…', false);

    try {
      if (targetId === null) {
        const res = await fetch('/api/projects', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        if (res.status === 201) {
          const data = await res.json();
          projects.push(data.project);
          inFlight = false;
          setDisabled(false);
          if (currentProjectId === null) {
            selectProject(data.project.id);
          } else {
            renderProjectList();
          }
          showStatus(`Project created successfully (#${data.project.id})`, false);
        } else {
          const data = await res.json().catch(() => ({}));
          showStatus(data.error || 'Failed to create project', true);
        }
      } else {
        const res = await fetch(`/api/projects/${targetId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        if (res.ok) {
          const data = await res.json();
          const idx = projects.findIndex((p) => p.id === targetId);
          if (idx !== -1) {
            projects[idx] = data.project;
          }
          inFlight = false;
          setDisabled(false);
          if (currentProjectId === targetId) {
            selectProject(data.project.id);
          } else {
            renderProjectList();
          }
          showStatus('Project saved successfully', false);
        } else {
          const data = await res.json().catch(() => ({}));
          showStatus(data.error || 'Failed to update project', true);
        }
      }
    } catch (_err) {
      showStatus('Network error while saving project', true);
    } finally {
      inFlight = false;
      setDisabled(false);
    }
  }

  if (saveBtn) {
    onAction(saveBtn, handleSave);
  }

  if (resetBtn) {
    onAction(resetBtn, () => {
      if (inFlight) return;
      if (currentProjectId !== null) {
        selectProject(currentProjectId);
      } else {
        selectNewProject();
      }
    });
  }

  async function handleDelete() {
    if (inFlight) return;
    const targetId = currentProjectId;
    if (targetId === null) return;
    const proj = projects.find((p) => p.id === targetId);
    const confirmed = window.confirm(`Are you sure you want to permanently delete "${proj ? proj.name : 'this project'}"?`);
    if (!confirmed) return;

    inFlight = true;
    setDisabled(true);
    showStatus('Deleting project…', false);

    try {
      const res = await fetch(`/api/projects/${targetId}`, {
        method: 'DELETE',
      });

      if (res.status === 204) {
        projects = projects.filter((p) => p.id !== targetId);
        inFlight = false;
        setDisabled(false);
        if (currentProjectId === targetId) {
          selectNewProject();
        } else {
          renderProjectList();
        }
        showStatus('Project deleted successfully', false);
      } else {
        const data = await res.json().catch(() => ({}));
        showStatus(data.error || 'Failed to delete project', true);
      }
    } catch (_err) {
      showStatus('Network error while deleting project', true);
    } finally {
      inFlight = false;
      setDisabled(false);
    }
  }

  if (deleteBtn) {
    onAction(deleteBtn, handleDelete);
  }

  if (newProjectBtn) {
    onAction(newProjectBtn, () => {
      if (inFlight) return;
      selectNewProject();
    });
  }

  async function handleLogout() {
    if (inFlight) return;
    inFlight = true;
    setDisabled(true);
    try {
      const res = await fetch('/api/auth/logout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: '{}',
      });
      if (res.ok) {
        window.location.reload();
        return;
      }
      const data = await res.json().catch(() => ({}));
      showStatus(data.error || 'Failed to log out', true);
    } catch (_err) {
      showStatus('Network error while logging out', true);
    } finally {
      inFlight = false;
      setDisabled(false);
    }
  }

  if (logoutBtn) {
    onAction(logoutBtn, handleLogout);
  }

  renderIconGrid();
  renderProjectList();
  if (projects.length > 0) {
    selectProject(projects[0].id);
  } else {
    selectNewProject();
  }
})();
</script>
