<main class="max-w-md mx-auto px-6 py-24 min-h-[70vh] flex flex-col justify-center">
  <div class="border border-outline-variant/60 bg-surface-container-lowest/90 p-8 shadow-2xl relative">
    <div class="flex items-center justify-between pb-4 mb-6 border-b border-outline-variant/40">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 bg-primary-container animate-pulse rounded-full inline-block"></span>
        <span class="font-mono text-xs uppercase tracking-[0.2em] text-primary-container">AUTH_REQUIRED</span>
      </div>
      <span class="font-mono text-[10px] uppercase tracking-widest text-outline-variant">PORTFOLIO_OS</span>
    </div>

    <div class="mb-6 space-y-2">
      <h1 class="text-xl font-headline font-bold uppercase text-white tracking-tight">Root Console Access</h1>
      <p class="font-mono text-xs text-on-surface-variant leading-relaxed">
        Restricted administrative interface. Provide secret token to establish authorized session.
      </p>
    </div>

    <form data-admin-login class="space-y-5" autocomplete="off">
      <div class="space-y-2">
        <label for="admin-secret-input" class="block font-mono text-[11px] uppercase tracking-[0.18em] text-primary-container">
          Admin Secret Token
        </label>
        <div class="relative">
          <input
            id="admin-secret-input"
            name="secret"
            type="password"
            required
            placeholder="••••••••••••••••"
            class="w-full bg-[#050505] border border-outline-variant/60 focus:border-primary-container focus:ring-1 focus:ring-primary-container font-mono text-sm text-on-surface px-4 py-3 outline-none transition-all placeholder:text-outline-variant/50">
        </div>
      </div>

      <div
        id="admin-login-error"
        role="alert"
        class="hidden border border-error/50 bg-error-container/20 text-error font-mono text-xs p-3 leading-normal"></div>

      <div class="pt-2">
        <button
          id="admin-login-submit"
          type="submit"
          class="w-full bg-primary-container text-on-primary-container hover:bg-primary-fixed-dim font-mono text-xs uppercase font-bold tracking-[0.2em] py-3.5 px-6 transition-all flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
          <span>Authenticate</span>
          <span class="material-symbols-outlined text-sm font-bold" aria-hidden="true">arrow_forward</span>
        </button>
      </div>
    </form>
  </div>
</main>

<script>
(() => {
  const form = document.querySelector('[data-admin-login]');
  if (!form) return;

  const input = form.querySelector('input[name="secret"]');
  const submitBtn = document.getElementById('admin-login-submit');
  const errorBox = document.getElementById('admin-login-error');
  let inFlight = false;

  async function handleLogin() {
    if (inFlight) return;
    const secret = input ? input.value : '';
    if (!secret) {
      if (input) input.focus();
      return;
    }

    inFlight = true;
    if (submitBtn) submitBtn.disabled = true;
    if (errorBox) {
      errorBox.classList.add('hidden');
      errorBox.textContent = '';
    }

    try {
      const response = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret }),
      });

      if (response.ok) {
        window.location.reload();
        return;
      }

      const data = await response.json().catch(() => ({}));
      const message = data.error || 'Authentication failed';
      if (errorBox) {
        errorBox.textContent = message;
        errorBox.classList.remove('hidden');
      }
    } catch (_err) {
      if (errorBox) {
        errorBox.textContent = 'Network error while authenticating';
        errorBox.classList.remove('hidden');
      }
    } finally {
      inFlight = false;
      if (submitBtn) submitBtn.disabled = false;
      if (input) input.focus();
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    handleLogin();
  });

  if (submitBtn) {
    submitBtn.addEventListener('mousedown', (e) => {
      if (e.button === 0) {
        e.preventDefault();
        handleLogin();
      }
    });
  }
})();
</script>
