<main class="max-w-6xl mx-auto px-5 sm:px-8 py-12 md:py-16">
  <!-- Page Header -->
  <header class="projects-header">
    <span aria-hidden="true">~/</span>
    <h1>проекты</h1>
    <span class="projects-header-cursor" aria-hidden="true"></span>
  </header>

  <!-- Projects Grid -->
  <div
    id="project-gallery"
    class="project-gallery"
    aria-busy="true"
    hx-get="/api/projects"
    hx-trigger="load, projects:retry"
    hx-swap="innerHTML">
    <div class="project-loading py-12 text-on-surface-variant text-sm" data-project-loading role="status">Загружаю проекты…</div>
  </div>
  <div id="project-load-error" class="border border-outline-variant/40 p-6" hidden>
    <p role="status" class="text-on-surface-variant text-sm">Не удалось загрузить проекты. Попробуйте ещё раз.</p>
    <button id="project-retry" type="button" class="mt-4 min-h-11 border border-primary-container px-4 text-sm text-primary-container">
      Повторить
    </button>
  </div>
  <!--#include projects/gallery.html-->
</main>
