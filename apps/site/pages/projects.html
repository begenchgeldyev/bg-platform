<main class="max-w-6xl mx-auto px-5 sm:px-8 py-12 md:py-16">
  <!-- Page Header -->
  <div class="mb-8 border-b border-outline-variant/70 pb-8">
    <div class="max-w-3xl space-y-5">
      <div class="inline-flex items-center gap-3 font-mono text-[11px] font-bold uppercase tracking-[0.32em] text-primary-container">
        <span class="h-px w-10 bg-primary-container/80"></span>
        <span>Project Archive</span>
      </div>
      <div class="space-y-4">
        <h1 class="text-5xl md:text-7xl font-headline font-black uppercase tracking-[-0.06em] leading-none text-white">Projects</h1>
        <p class="max-w-2xl border-l-2 border-primary-container/70 pl-4 font-mono text-sm md:text-base leading-7 text-on-surface-variant">
          Production-grade systems &amp; experimental tools, presented with the same precision as the work behind them.
        </p>
      </div>
    </div>
  </div>

  <!-- Projects Grid -->
  <div
    id="project-gallery"
    class="project-gallery"
    aria-busy="true"
    hx-get="/api/projects"
    hx-trigger="load, projects:retry"
    hx-swap="innerHTML">
    <div class="project-loading py-12 text-on-surface-variant text-sm" data-project-loading role="status">Loading projects…</div>
  </div>
  <div id="project-load-error" class="border border-outline-variant/40 p-6" hidden>
    <p role="status" class="text-on-surface-variant text-sm">Projects couldn't load. Please try again.</p>
    <button id="project-retry" type="button" class="mt-4 min-h-11 border border-primary-container px-4 text-sm text-primary-container">
      Try again
    </button>
  </div>
  <!--#include projects/gallery.html-->
</main>
